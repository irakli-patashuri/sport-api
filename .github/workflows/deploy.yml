name: Deploy sport-api

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            APP_DIR=/var/www/netspor-laravel-api
            cd "$APP_DIR"

            git config --global --add safe.directory "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan view:cache
            # Avoid route:cache behind Apache Alias / subdirectory — can break GET /
            php artisan route:clear
            php artisan storage:link || true

            chmod -R 775 storage bootstrap/cache || true

            curl -sf "http://127.0.0.1/netspor-laravel-api/api/health" \
              || curl -sf "http://127.0.0.1/netspor-laravel-api/api/v1/countries?per_page=1" \
              || echo "WARN: health probe failed (check Apache vhost)"

            echo "Deploy OK — sport-api"
